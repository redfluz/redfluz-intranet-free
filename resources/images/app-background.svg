<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" fill="none" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fcf8f7" />
            <stop offset="52%" stop-color="#f7f8fb" />
            <stop offset="100%" stop-color="#f2f6fd" />
        </linearGradient>

        <radialGradient id="rose" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f6b3b6" stop-opacity=".34" />
            <stop offset="46%" stop-color="#f8c3c5" stop-opacity=".2" />
            <stop offset="78%" stop-color="#fad7d8" stop-opacity=".08" />
            <stop offset="100%" stop-color="#fad7d8" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="sky" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b9d4f4" stop-opacity=".36" />
            <stop offset="46%" stop-color="#c8ddf5" stop-opacity=".21" />
            <stop offset="78%" stop-color="#dbe9fa" stop-opacity=".08" />
            <stop offset="100%" stop-color="#dbe9fa" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="lilac" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#dcc7f6" stop-opacity=".3" />
            <stop offset="46%" stop-color="#e4d3f8" stop-opacity=".18" />
            <stop offset="78%" stop-color="#efe5fb" stop-opacity=".07" />
            <stop offset="100%" stop-color="#efe5fb" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="warm" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fde9b8" stop-opacity=".26" />
            <stop offset="50%" stop-color="#fdf0cf" stop-opacity=".14" />
            <stop offset="100%" stop-color="#fdf6e4" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="light-sweep" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity=".5" />
            <stop offset="45%" stop-color="#ffffff" stop-opacity=".18" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="150" />
        </filter>

        <radialGradient id="vignette" cx="50%" cy="48%" r="62%">
            <stop offset="0%" stop-color="#f7f8fb" stop-opacity=".52" />
            <stop offset="70%" stop-color="#f7f8fb" stop-opacity=".12" />
            <stop offset="100%" stop-color="#f7f8fb" stop-opacity="0" />
        </radialGradient>
    </defs>

    <rect width="2560" height="1600" fill="url(#paper)" />

    <ellipse cx="2110" cy="140" rx="1080" ry="880" fill="url(#rose)" />
    <ellipse cx="330" cy="1470" rx="1180" ry="920" fill="url(#sky)" />
    <ellipse cx="1810" cy="1410" rx="980" ry="800" fill="url(#lilac)" />
    <ellipse cx="230" cy="210" rx="720" ry="620" fill="url(#warm)" />

    <g filter="url(#soften)">
        <path d="M-260 1210 C 430 860, 980 1450, 1620 1140 S 2420 760, 2820 1080 L 2820 1860 L -260 1860 Z"
            fill="url(#light-sweep)" opacity=".5" />
    </g>

    <ellipse cx="1280" cy="770" rx="1180" ry="720" fill="url(#vignette)" />
</svg>
