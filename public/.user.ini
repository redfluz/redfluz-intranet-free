; Upload limits for PHP-FPM / CGI deployments.
;
; Phone photos routinely exceed PHP's 2 MB default, and PHP discards an
; oversized upload before Laravel can validate it. The app also downscales
; images in the browser, but this keeps direct posts and larger attachments
; working. The built-in `php artisan serve` server ignores .user.ini; it uses
; the limits from the loaded php.ini instead.
;
; post_max_size must stay larger than upload_max_filesize because the whole
; multipart body counts against it.

upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 120
